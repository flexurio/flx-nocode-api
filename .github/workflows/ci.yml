name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, unit tests, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Build (all targets incl. benches)
        run: cargo check --locked --all-targets
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - name: Clippy
        # unwrap_used/expect_used are `warn` in the request-path modules and
        # become blocking in Phase 2 once the remaining sites are cleaned up.
        # Every default lint group is blocking. `clippy::unwrap_used` /
        # `expect_used` are `warn` inside the request-path modules (handlers,
        # services, repositories) and stay advisory until Phase 2 cleans up the
        # remaining sites; a blanket `-D warnings` would promote them too.
        run: >-
          cargo clippy --locked --all-targets --
          -D clippy::correctness -D clippy::suspicious -D clippy::complexity
          -D clippy::perf -D clippy::style -D unused -D dead_code

  e2e:
    name: End-to-end (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
          - db: postgres
            url: postgres://flx:flx@localhost:5432/flx
          - db: mysql
            url: mysql://flx:flx@localhost:3306/flx
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: flx
          POSTGRES_PASSWORD: flx
          POSTGRES_DB: flx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flx" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_USER: flx
          MYSQL_PASSWORD: flx
          MYSQL_DATABASE: flx
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Run end-to-end test
        env:
          IT_DB_TYPE: ${{ matrix.db }}
          IT_DB_URL: ${{ matrix.url }}
        run: cargo test --locked --test e2e_http -- --nocapture

  perf-smoke:
    name: k6 smoke (advisory until baseline is recorded)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Build release binary
        run: cargo build --locked --release
      - name: Start server (SQLite, auth off)
        run: |
          mkdir -p /tmp/flx && cd /tmp/flx
          cp -r "$GITHUB_WORKSPACE/config" ./config
          cat > .env <<EOT
          DB_TYPE=sqlite
          SQLITE_URL=sqlite:///tmp/flx/data.db
          SECRET_KEY=ci-secret
          ENCRYPT_KEY=0123456789abcdef0123456789abcdef
          PORT=8080
          REQUIRE_AUTH=false
          CONFIG_LINT=warn
          RUST_LOG=warn
          EOT
          nohup "$GITHUB_WORKSPACE/target/release/flx-nocode-api" > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: Cached read path
        run: k6 run --quiet perf/k6/get-list-cached.js
        env: { BASE_URL: http://127.0.0.1:8080, ROUTE: master_department, RPS: "200", DURATION: "20s" }
      - name: Uncached read path
        run: k6 run --quiet perf/k6/get-list-uncached.js
        env: { BASE_URL: http://127.0.0.1:8080, ROUTE: master_department, RPS: "100", DURATION: "20s" }
      - name: Server metrics snapshot
        if: always()
        run: curl -s http://127.0.0.1:8080/metrics | grep -E "flx_(http_request_duration_seconds_(sum|count)|db_pool|cache_)" || true
