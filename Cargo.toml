[package]
name = "flx-nocode-api"
version = "0.4.5"
edition = "2024"

# Optimization settings for performance
[profile.release]
opt-level = 3     # Maximum optimization
lto = "thin"      # Thin LTO for strong inter-procedural optimization
codegen-units = 1 # Maximum optimization across compilation units
panic = "abort"   # Smaller binary size and no unwinding overhead
strip = true      # Remove debug symbols

[profile.dev]
opt-level = 1          # Some optimization in debug mode
debug = true           # Keep debug info
overflow-checks = true # Runtime integer overflow checks

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
actix = "0.13.5"
actix-web = "4.15.0"
actix-files = "0.7"
actix-multipart = "0.8"
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
] }
tiberius = { version = "0.12", default-features = false, features = [
    "chrono",
    "rustls",
] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2.5"
bb8 = { version = "0.9", optional = true }
futures-util = "0.3"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
] }
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.21.4"
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.23"
colored = "3.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
aes-gcm = "0.11.1"
argon2 = "0.6"
rand = "0.10.2"
sha2 = "0.11.0"
regex = "1.13.1"
actix-cors = "0.7.2"
async-trait = "0.1"
rust_decimal = "1.42.1"
reqwest = { version = "0.13.4", features = ["json"] }
zip = "8.6.0"
sanitize-filename = "0.6"
infer = "0.22"
csv = "1.4"
calamine = { version = "0.36", default-features = false }
rust_xlsxwriter = "0.99"
redis = { version = "1.6", features = [
    "aio",
    "tokio-comp",
    "connection-manager",
] }
urlencoding = "2.1"
mongodb = { version = "3.8", optional = true }
# Performance optimizations
parking_lot = "0.12"
ahash = "0.8"
smallvec = "1.15"
lettre = { version = "0.11.23", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "pool",
    "hostname",
] }

[features]
default = ["mysql", "postgres", "sqlite", "mssql", "mongodb"]
# default = ["mysql"]
mysql = ["sqlx/mysql", "sqlx/chrono"]
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mssql = ["tiberius/chrono", "bb8"]
mongodb = ["dep:mongodb"]
