[package]
name = "flexurio-api-nocode-v2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.5"
actix-web = "4.9.0"
actix-files = "0.6"
actix-multipart = "0.7"
dotenv = "0.15.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sqlx = { version = "0.8.3", features = ["runtime-async-std-native-tls", "mysql", "chrono"] }
chrono = { version = "0.4.40", features = ["serde"] }
once_cell = "1.20.3"
futures = "0.3"
anyhow = "1.0"
base64 = "0.22"
colored = "3.0"
jsonwebtoken = "9.3.1"
aes-gcm = "0.10.3"
rand = "0.9.0"
sha2 = "0.10.8"
regex = "1.11.1"
actix-cors = "0.7.1"
