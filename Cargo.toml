[package]
name = "flx-nocode-api"
version = "0.3.7"
edition = "2024"

# Optimization settings for performance
[profile.release]
opt-level = 3          # Maximum optimization
lto = "thin"          # Faster than full LTO with good optimization
codegen-units = 16    # Balance between speed and size
panic = "abort"       # Smaller binary size
strip = true          # Remove debug symbols

[profile.dev]
opt-level = 1         # Some optimization in debug mode
debug = true          # Keep debug info
overflow-checks = true # Runtime integer overflow checks

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
actix = "0.13.5"
actix-web = "4.13.0"
actix-files = "0.6"
actix-multipart = "0.7"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-async-std-native-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2.5"
bb8 = { version = "0.9", optional = true }
futures-util = "0.3"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time"] }
chrono = { version = "0.4.44", features = ["serde"] }
once_cell = "1.21.4"
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
colored = "3.1"
jsonwebtoken = "10.3.0"
aes-gcm = "0.10.3"
argon2 = "0.5"
rand = "0.10.1"
sha2 = "0.11.0"
regex = "1.12.3"
actix-cors = "0.7.1"
async-trait = "0.1"
rust_decimal = "1.41.0"
reqwest = { version = "0.13.2", features = ["json"] }
zip = "8.5.1"
sanitize-filename = "0.6"
infer = "0.19"
csv = "1.4"
calamine = { version = "0.34", default-features = false }
rust_xlsxwriter = "0.94"
redis = { version = "1.2", features = ["aio", "tokio-comp", "connection-manager"] }
urlencoding = "2.1"
mongodb = { version = "3.5", optional = true }
# Performance optimizations
parking_lot = "0.12"
ahash = "0.8"
smallvec = "1.15"

[features]
default = ["mysql", "postgres", "sqlite", "mssql", "mongodb"]
# default = ["mysql"]
mysql = ["sqlx/mysql", "sqlx/chrono"]
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mssql = ["tiberius/chrono", "bb8"]
mongodb = ["dep:mongodb"]
