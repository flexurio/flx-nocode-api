[package]
name = "flx-nocode-api"
version = "0.1.48"
edition = "2024"

# Optimization settings for performance
[profile.release]
opt-level = 3          # Maximum optimization
lto = "thin"          # Faster than full LTO with good optimization
codegen-units = 16    # Balance between speed and size
panic = "abort"       # Smaller binary size
strip = true          # Remove debug symbols

[profile.dev]
opt-level = 1         # Some optimization in debug mode
debug = true          # Keep debug info
overflow-checks = true # Runtime integer overflow checks

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
actix = "0.13.5"
actix-web = "4.11.0"
actix-files = "0.6"
actix-multipart = "0.7"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-async-std-native-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2.5"
bb8 = { version = "0.8", optional = true }
futures-util = "0.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time"] }
chrono = { version = "0.4.42", features = ["serde"] }
once_cell = "1.21.3"
futures = "0.3"
anyhow = "1.0"
base64 = "0.22"
colored = "3.0"
jsonwebtoken = "9.3.1"
aes-gcm = "0.10.3"
rand = "0.9.2"
sha2 = "0.10.9"
regex = "1.11.3"
actix-cors = "0.7.1"
async-trait = "0.1"
rust_decimal = "1.38.0"
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
zip = "4.6.1"
sanitize-filename = "0.5"
infer = "0.15"
csv = "1.3"
calamine = { version = "0.30", default-features = false }
rust_xlsxwriter = "0.79"
redis = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
urlencoding = "2.1"
mongodb = { version = "3.3", optional = true }
# Performance optimizations
parking_lot = "0.12"
ahash = "0.8"
smallvec = "1.15"
num_cpus = "1.16"

[features]
default = ["mysql", "postgres", "sqlite", "mssql", "mongodb"]
# default = ["mysql"]
mysql = ["sqlx/mysql", "sqlx/chrono"]
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mssql = ["tiberius/chrono", "bb8"]
mongodb = ["dep:mongodb"]
